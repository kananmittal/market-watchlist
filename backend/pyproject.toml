[project]
name = "watchlist-backend"
version = "0.1.0"
description = "Time-aware market watchlist: remembers what you saw, surfaces what meaningfully changed."
requires-python = ">=3.11"
dependencies = [
    # --- web framework ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",

    # --- config & validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",

    # --- database (MongoDB) ---
    "pymongo>=4.13",

    # --- auth ---
    "pyjwt>=2.9",
    "bcrypt>=4.2",

    # --- http ---
    "httpx>=0.27",
    "tenacity>=9.0",

    # --- market data providers ---
    "yfinance>=0.2.50",
    "jugaad-data>=0.35",
    "pandas>=2.2",
    "numpy>=1.26",

    # --- news ---
    "feedparser>=6.0",

    # --- llm ---
    "groq>=0.13",

    # --- observability ---
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Playwright's sync API installs its own event loop, which prevents
# pytest-asyncio from creating one for any async test collected afterwards.
# E2E therefore runs as a separate suite: `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = [
    "e2e: browser end-to-end tests; needs the API and web servers running",
]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
